# Review the provider's current price before creating this paid service/disk.
services:
  - type: web
    name: akij-dealership
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py 'wsgi:create_application()'
    healthCheckPath: /healthz
    numInstances: 1
    disk:
      name: dealership-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEALERSHIP_DATA_DIR
        value: /var/data
      - key: DEALERSHIP_USERNAME
        value: admin
      - key: DEALERSHIP_PASSWORD
        sync: false
      - key: DEALERSHIP_REQUIRE_AUTH
        value: "1"
      - key: TZ
        value: Asia/Dhaka
